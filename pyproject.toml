[project]
name = "taccdoc-rag-pod"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.3.5",
    "fastapi[standard]>=0.125.0",
    "pydantic-ai-slim[ag-ui,openai]>=2.0.0,<3.0",
    "tapipy (>=1.9.1, <2.0)",
    "uvicorn>=0.38.0",
]

[tool.uv]
required-environments = [
    "implementation_name == 'cpython' and platform_python_implementation == 'CPython' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "implementation_name == 'cpython' and platform_python_implementation == 'CPython' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "implementation_name == 'cpython' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "implementation_name == 'cpython' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "implementation_name == 'cpython' and platform_python_implementation == 'CPython' and sys_platform == 'win32' and platform_machine == 'AMD64'",
]
