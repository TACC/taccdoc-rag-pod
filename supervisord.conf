[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0


[program:client]
command=pnpm --prefix client run start -H  0.0.0.0 -p 8888
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0



[program:server]
command=uv run --env-file=/mnt/data/.env fastapi run agent.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
