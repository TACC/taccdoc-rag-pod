[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0


[program:client]
command=npm run start --prefix client -- -H  0.0.0.0 -p 8888
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0



[program:server]
command=uv run --env-file=/mnt/data/.env agent.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
